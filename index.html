<style>
:root{color-scheme:dark;--bg:#0e0b0c;--panel:#1a1517;--ink:#f4efee;--mute:#a79d9f;--red:#e50914;--line:#2c2326}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",sans-serif}h1,h2,h3,h4{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;line-height:.98;margin:0}nav{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;padding:14px 5vw;background:#0e0b0ce8;backdrop-filter:blur(8px)}nav .logo{font-family:"Bebas Neue",sans-serif;color:var(--red);font-size:28px;margin-right:auto}nav a{color:var(--mute);text-decoration:none}nav a:hover{color:var(--ink)}.hero{padding:7vh 7vw;min-height:calc(100vh - 72px);display:flex;align-items:center;overflow:hidden;position:relative;background:radial-gradient(ellipse at 72% 55%,#54251770,transparent 48%),linear-gradient(110deg,#0e0b0c 20%,#160c09 70%,#0e0b0c)}.hero-layout{width:100%;max-width:1400px;margin:0 auto;min-height:72vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);align-items:center;position:relative}.hero-copy{position:relative;z-index:2;padding:36px 0}.hero-heading{display:block;max-width:760px}.hero-photo{display:block;position:absolute;right:-2vw;bottom:-8vh;width:min(57%,760px);height:100%;max-height:850px;object-fit:cover;object-position:center 20%;border:0;border-radius:0;box-shadow:none;background:transparent;z-index:1;mix-blend-mode:lighten;mask-image:radial-gradient(ellipse 70% 78% at 58% 48%,#000 43%,rgba(0,0,0,.85) 60%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 70% 78% at 58% 48%,#000 43%,rgba(0,0,0,.85) 60%,transparent 100%)}.hero h1{font-size:clamp(58px,7.2vw,112px);overflow-wrap:normal;letter-spacing:-.015em;position:relative;z-index:2}.hero p{max-width:28em;color:#d1c5c2;margin:26px 0;font-size:18px;position:relative;z-index:2}.btn{display:inline-block;border:0;border-radius:6px;padding:12px 22px;font:700 15px "DM Sans",sans-serif;margin:0 10px 8px 0;text-decoration:none;cursor:pointer}.btn.primary{background:var(--ink);color:var(--bg)}.btn.secondary{background:#7f7f7f4d;color:var(--ink)}.row{padding:18px 0 24px}.row h2{font-size:32px;padding:0 5vw 12px}.track{display:flex;gap:12px;overflow-x:auto;padding:4px 5vw 16px}.card{flex:0 0 min(270px,76vw);min-height:155px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:var(--ink)}button.card{cursor:pointer}.card:before{content:"";position:absolute;inset:0;background:var(--g);opacity:.22}.card>*{position:relative}.card h3{font-size:30px}.card span{font-size:13px;color:var(--ink);opacity:.8;margin-top:7px}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 5vw}.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:14px}footer{text-align:center;padding:12vh 20px 10vh;border-top:1px solid var(--line);margin-top:50px}footer h2{font-size:clamp(48px,10vw,110px)}footer p{color:var(--mute)}footer a{display:inline-block;margin:6px;padding:10px 20px;border-radius:6px;background:var(--red);color:#fff;text-decoration:none;font-weight:700}#modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:20}#modal.on{display:grid}.sheet{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:28px;border:1px solid var(--line)}.sheet h2{font-size:48px;margin-bottom:8px}.meta{color:var(--red);font-weight:700;margin-bottom:14px}.sheet ul{padding-left:22px}.sheet .btn{margin-top:18px}@media(max-width:720px){nav{gap:10px;padding:12px 4vw}nav .logo{font-size:23px}nav a{font-size:13px}.hero{padding:5vh 5vw;min-height:76vh}.hero-layout{min-height:68vh;grid-template-columns:1fr;align-items:center}.hero-copy{padding:30px 0 150px}.hero-photo{right:-8vw;bottom:-4vh;width:82%;height:72%;max-height:none;object-position:center 18%;opacity:.76;mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 72%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 72%,transparent 100%)}.hero h1{font-size:clamp(46px,10vw,76px);max-width:8em}.hero p{font-size:16px;max-width:22em}.row h2{font-size:28px}}@media(max-width:360px){.hero h1{font-size:42px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body>
<main>
<nav><span class="logo">ANKIT KANAUJIYA</span><a href="#stories">Stories</a><a href="#projects">Projects</a><a href="#skills">Skills</a></nav>
<header class="hero"><div class="hero-layout"><div class="hero-copy"><div class="hero-heading"><h1>ANKIT<br>KANAUJIYA</h1></div><p>B.Tech CSE student exploring programming, web development, GitHub collaboration, and practical projects.</p><button class="btn primary" data-open="story">▶ Read my story</button><a class="btn secondary" href="#projects">Explore projects</a></div><img class="hero-photo" src="./ankit-photo.jpg" alt="Portrait of Ankit Kanaujiya"></div></header>
<div id="rows"></div>
<footer><h2>TO BE CONTINUED…</h2><p>Open to learning, collaboration, and good ideas.</p><a href="mailto:ankitkanaujiya0714@gmail.com">Email me</a><a href="https://github.com/Ankit0714K" target="_blank" rel="noopener noreferrer">GitHub</a><a href="https://www.linkedin.com/in/ankit-kumar-8b125a381/" target="_blank" rel="noopener noreferrer">LinkedIn</a></footer>
</main>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="sheet" id="sheet"></div></div>
<script>
const ME={stories:[
{t:"The full story",s:"Who I am",g:"#e50914",meta:"My story",body:"<p>I'm Ankit Kanaujiya, a B.Tech Computer Science student who is learning by asking questions, experimenting, and building things. I like understanding how technology works instead of just copying steps, whether I'm studying Python, databases, software engineering models, or web development.</p><p>My learning has been practical as well as academic. I've been working on a School ERP idea, learning how to organize code on GitHub, and figuring out how to collaborate without losing work. I've also been preparing for community hackathon activities and exploring open-source development.</p><p>I don't claim to know everything yet. I'm building my skills one step at a time, learning from mistakes, and trying to turn what I learn into useful projects. This portfolio is a record of that process—and a place to keep improving.</p>"},
{t:"Experience",s:"",g:"#dd6b20",meta:"",body:""},
{t:"Achievement",s:"Smart India Hackathon 2026 · TPU & JAX Workshop",g:"#d69e2e",meta:"Certificates of Participation",images:["./certificate%20of%20participation.jpeg","https://raw.githubusercontent.com/Ankit0714K/ankit-portfolio/main/WhatsApp%20Image%202026-10-29%20at%2017.53.46.jpeg"],imageLabels:["Internal Smart India Hackathon 2026","TPU & JAX Workshop · 24 October 2026"],body:"<p><b>Smart India Hackathon 2026:</b> Qualified in the internal SIH 2026 at United University.</p><p><b>TPU & JAX Workshop:</b> Successfully participated in the Accelerated Intelligence Lab hands-on workshop organized by WikiClub Tech UU in collaboration with TensorFlow User Group Prayagraj (TFUG), on 24 October 2026.</p>"},
{t:"My journey",s:"Learning, building, improving",g:"#3182ce",meta:"My journey",body:"<ul><li><b>Building fundamentals:</b> Studying core computer science topics including Python, databases, and software engineering.</li><li><b>Practising through projects:</b> Exploring web development and working on a School ERP concept.</li><li><b>Learning GitHub:</b> Getting comfortable with repositories, commits, file uploads, and protecting existing work while making changes.</li><li><b>Preparing to collaborate:</b> Exploring hackathons and open-source community work, including MLH and GDG Hackday activities.</li><li><b>Exploring ideas:</b> Brainstorming projects such as YUGA, an educational game concept inspired by Indian civilization and culture.</li><li><b>What's next:</b> Keep learning, improve the School ERP, finish more projects, and become more confident contributing to shared code.</li></ul>"}],
projects:[
{t:"School ERP",s:"School management platform",g:"#805ad5",meta:"In progress · Web development",body:"<p>A school-management project concept intended to bring everyday school tasks into one place.</p><ul><li>Management dashboard and teacher attendance</li><li>Teacher area for marking student attendance</li><li>Student area for fee details, attendance, and results</li><li>Planned role-based access and database-backed records</li></ul><p>I'm developing my understanding of the tools and workflow as the project grows.</p>"},
{t:"",s:"",g:"#319795",meta:"",body:""},{t:"",s:"",g:"#d53f8c",meta:"",body:""},{t:"",s:"",g:"#38a169",meta:"",body:""}],
skills:["HTML","CSS","Python","JavaScript · learning","GitHub · learning"]};
const $=s=>document.querySelector(s);let registry=[];
function card(c){if(!c.t)return '<div class="card" style="--g:'+c.g+'" aria-hidden="true"></div>';registry.push(c);return '<button class="card" style="--g:'+c.g+'" data-open="'+(registry.length-1)+'"><h3>'+(c.t=== "Internal Smart India Hackathon 2026" ? "ACHIEVEMENT" : c.t)+'</h3>'+(c.s?'<span>'+c.s+'</span>':'')+'</button>'}
function render(){registry=[];$('#rows').innerHTML='<section class="row" id="stories"><h2>My story</h2><div class="track">'+ME.stories.map(card).join('')+'</div></section><section class="row" id="projects"><h2>Projects</h2><div class="track">'+ME.projects.map(card).join('')+'</div></section><section class="row" id="skills"><h2>Skills I\'m building</h2><div class="chips">'+ME.skills.map(s=>'<span class="chip">'+s+'</span>').join('')+'</div></section>'}
render();
document.addEventListener('click',e=>{const t=e.target.closest('[data-open]');if(!t)return;const c=t.dataset.open==='story'?ME.stories[0]:registry[Number(t.dataset.open)];if(!c)return;$('#sheet').innerHTML='<h2 id="modalTitle">'+c.t+'</h2>'+(c.meta?'<div class="meta">'+c.meta+'</div>':'')+(c.images?c.images.map((src,i)=>'<div style="margin:14px 0 20px"><p style="font-weight:700;margin-bottom:8px">'+c.imageLabels[i]+'</p><img src="'+src+'" alt="'+c.imageLabels[i]+' certificate" style="display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;background:#fff;border-radius:6px"></div>').join(''):(c.image?'<img src="'+c.image+'" alt="Certificate" style="display:block;width:100%;height:auto;max-height:60vh;object-fit:contain;background:#fff;border-radius:6px;margin:14px 0 20px">':''))+(c.body||'')+'<button class="btn primary" id="close">Close</button>';$('#modal').classList.add('on');$('#close').focus()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.id==='close')$('#modal').classList.remove('on')});addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
</script>

<style>
#admin-entry{margin-left:4px;border:1px solid #514044;background:transparent;color:var(--ink);padding:7px 12px;border-radius:5px;cursor:pointer;font:500 13px "DM Sans",sans-serif}
#admin-panel{display:none;margin:24px 5vw;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#admin-panel.on{display:block}
#admin-panel input,#admin-panel textarea,#admin-panel select{width:100%;margin:6px 0 12px;padding:11px;background:#100d0e;color:var(--ink);border:1px solid #514044;border-radius:5px;font:14px "DM Sans",sans-serif}
#admin-panel label{font-size:13px;color:var(--mute)}
#admin-panel .admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#admin-status{color:var(--mute);font-size:13px;margin:8px 0}
.admin-record{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.admin-record strong{font-size:14px}
.admin-record button{margin:2px;padding:6px 10px}
@media(max-width:600px){#admin-panel .admin-grid{grid-template-columns:1fr}.admin-record{align-items:flex-start;flex-direction:column}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const SUPABASE_URL = "https://jdmbqcmwrofkwtaybvzz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OV6daggoyfm0ees-AvVgJQ_yEyCe-V6";
  const ADMIN_EMAIL = "ankitkanaujiya0714@gmail.com";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
  const safeUrl = value => { try { const u = new URL(value); return ["https:","http:"].includes(u.protocol) ? u.href : ""; } catch { return ""; } };
  let records = [];
  const originalSkills = [...ME.skills];
  let isAdmin = false;
  let editingId = null;

  const adminButton = document.createElement("button");
  adminButton.id = "admin-entry";
  adminButton.type = "button";
  adminButton.textContent = "Admin";
  document.querySelector("nav").appendChild(adminButton);

  const panel = document.createElement("section");
  panel.id = "admin-panel";
  panel.innerHTML = `
    <h2 style="font-size:34px;margin-bottom:12px">PORTFOLIO ADMIN</h2>
    <div id="admin-status">Sign in with the authorized admin account.</div>
    <form id="admin-login">
      <div class="admin-grid">
        <div><label for="admin-email">Email</label><input id="admin-email" type="email" autocomplete="username" required value="${ADMIN_EMAIL}"></div>
        <div><label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required></div>
      </div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <div id="admin-tools" hidden>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
        <p style="margin:0;color:var(--mute)">Manage projects, achievements, skills and experience.</p>
        <button class="btn secondary" id="admin-logout" type="button">Sign out</button>
      </div>
      <form id="item-form" style="margin-top:20px">
        <div class="admin-grid">
          <div><label for="item-section">Section</label><select id="item-section"><option value="projects">Projects</option><option value="achievements">Achievements</option><option value="skills">Skills</option><option value="experience">Experience</option></select></div>
          <div><label for="item-title">Title</label><input id="item-title" maxlength="100" required></div>
          <div><label for="item-subtitle">Subtitle</label><input id="item-subtitle" maxlength="160"></div>
          <div><label for="item-link">Link (optional)</label><input id="item-link" type="url" placeholder="https://..."></div>
        </div>
        <label for="item-description">Description</label><textarea id="item-description" rows="4" maxlength="5000"></textarea>
        <div class="admin-grid">
          <div><label for="item-image-url">Image URL (optional)</label><input id="item-image-url" type="url" placeholder="https://..."></div>
          <div><label for="item-image-file">Or upload image (JPG, PNG, WEBP, GIF; max 5 MB)</label><input id="item-image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
        </div>
        <label><input id="item-visible" type="checkbox" checked style="width:auto;margin-right:8px">Visible on public portfolio</label><br>
        <button class="btn primary" type="submit" id="item-save">Add item</button>
        <button class="btn secondary" type="button" id="item-cancel" hidden>Cancel edit</button>
      </form>
      <h3 style="font-size:25px;margin:20px 0 8px">EXISTING ITEMS</h3>
      <div id="admin-records"></div>
    </div>`;
  document.querySelector("footer").before(panel);

  const status = message => { panel.querySelector("#admin-status").textContent = message; };
  const controls = panel.querySelector("#admin-tools");
  const loginForm = panel.querySelector("#admin-login");
  const itemForm = panel.querySelector("#item-form");

  function addRecordToPortfolio(row) {
    const section = row.section === "achievements" ? "stories" : row.section;
    const target = row.section === "skills" ? null : (section === "experience" ? "stories" : section);
    const item = {
      t: esc(row.title),
      s: esc(row.subtitle || ""),
      g: row.section === "projects" ? "#805ad5" : row.section === "achievements" ? "#d69e2e" : row.section === "experience" ? "#dd6b20" : "#3182ce",
      meta: esc(row.subtitle || row.section),
      body: row.description ? "<p>" + esc(row.description).replace(/\n/g,"<br>") + "</p>" : "",
      image: safeUrl(row.image_url || ""),
      _cms: true,
      _id: row.id
    };
    if (row.section === "skills") {
      ME.skills.push(item.t);
    } else if (row.section === "achievements") {
      ME.stories.push(item);
    } else if (row.section === "experience") {
      ME.stories.splice(1, 0, item);
    } else {
      ME.projects.push(item);
    }
  }

  function renderPortfolio() {
    ME.stories = ME.stories.filter(x => !x._cms);
    ME.projects = ME.projects.filter(x => !x._cms);
    ME.skills = [...originalSkills];
    for (const row of records) {
      if (row.is_visible || isAdmin) addRecordToPortfolio(row);
    }
    render();
  }

  function renderAdminRecords() {
    const host = panel.querySelector("#admin-records");
    host.replaceChildren();
    if (!records.length) {
      const p = document.createElement("p");
      p.textContent = "No CMS items added yet.";
      host.appendChild(p);
      return;
    }
    records.forEach(row => {
      const line = document.createElement("div");
      line.className = "admin-record";
      const label = document.createElement("strong");
      label.textContent = row.section.toUpperCase() + " · " + row.title + (row.is_visible ? "" : " · Hidden");
      const actions = document.createElement("div");
      const edit = document.createElement("button");
      edit.className = "btn secondary";
      edit.type = "button";
      edit.textContent = "Edit";
      edit.addEventListener("click", () => beginEdit(row));
      const del = document.createElement("button");
      del.className = "btn secondary";
      del.type = "button";
      del.textContent = "Delete";
      del.addEventListener("click", () => deleteRecord(row));
      actions.append(edit, del);
      line.append(label, actions);
      host.appendChild(line);
    });
  }

  async function loadRecords() {
    const { data, error } = await db.from("portfolio_items").select("*").order("sort_order").order("created_at");
    if (error) { status("Could not load portfolio items: " + error.message); return; }
    records = data || [];
    renderPortfolio();
    if (isAdmin) renderAdminRecords();
  }

  async function checkSession() {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return;
    if (session.user.email?.toLowerCase() !== ADMIN_EMAIL || session.user.app_metadata?.role !== "admin") {
      status("This account is not authorized as the portfolio admin. Sign out and use the approved admin account.");
      await db.auth.signOut();
      return;
    }
    isAdmin = true;
    loginForm.hidden = true;
    controls.hidden = false;
    status("Signed in as " + ADMIN_EMAIL);
    await loadRecords();
  }

  adminButton.addEventListener("click", () => {
    panel.classList.toggle("on");
    if (panel.classList.contains("on")) panel.scrollIntoView({behavior:"smooth",block:"start"});
  });

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    const email = panel.querySelector("#admin-email").value.trim().toLowerCase();
    const password = panel.querySelector("#admin-password").value;
    if (email !== ADMIN_EMAIL) { status("Only the approved admin email can sign in here."); return; }
    status("Signing in...");
    const { error } = await db.auth.signInWithPassword({email,password});
    panel.querySelector("#admin-password").value = "";
    if (error) { status("Sign-in failed: " + error.message); return; }
    await checkSession();
  });

  panel.querySelector("#admin-logout").addEventListener("click", async () => {
    await db.auth.signOut();
    isAdmin = false;
    controls.hidden = true;
    loginForm.hidden = false;
    status("Signed out.");
    await loadRecords();
  });

  function beginEdit(row) {
    editingId = row.id;
    panel.querySelector("#item-section").value = row.section;
    panel.querySelector("#item-title").value = row.title;
    panel.querySelector("#item-subtitle").value = row.subtitle || "";
    panel.querySelector("#item-link").value = row.link_url || "";
    panel.querySelector("#item-description").value = row.description || "";
    panel.querySelector("#item-image-url").value = row.image_url || "";
    panel.querySelector("#item-visible").checked = row.is_visible;
    panel.querySelector("#item-save").textContent = "Save changes";
    panel.querySelector("#item-cancel").hidden = false;
    itemForm.scrollIntoView({behavior:"smooth",block:"center"});
  }

  function resetForm() {
    editingId = null;
    itemForm.reset();
    panel.querySelector("#item-visible").checked = true;
    panel.querySelector("#item-save").textContent = "Add item";
    panel.querySelector("#item-cancel").hidden = true;
  }
  panel.querySelector("#item-cancel").addEventListener("click", resetForm);

  itemForm.addEventListener("submit", async event => {
    event.preventDefault();
    if (!isAdmin) return;
    const file = panel.querySelector("#item-image-file").files[0];
    let imageUrl = safeUrl(panel.querySelector("#item-image-url").value.trim());
    if (file) {
      if (file.size > 5 * 1024 * 1024) { status("Image is larger than 5 MB."); return; }
      const ext = file.name.split(".").pop().toLowerCase();
      const path = crypto.randomUUID() + "." + ext;
      status("Uploading image...");
      const { error: uploadError } = await db.storage.from("portfolio-media").upload(path,file,{upsert:false,contentType:file.type});
      if (uploadError) { status("Image upload failed: " + uploadError.message); return; }
      imageUrl = db.storage.from("portfolio-media").getPublicUrl(path).data.publicUrl;
    }
    const payload = {
      section: panel.querySelector("#item-section").value,
      title: panel.querySelector("#item-title").value.trim(),
      subtitle: panel.querySelector("#item-subtitle").value.trim(),
      description: panel.querySelector("#item-description").value.trim(),
      link_url: safeUrl(panel.querySelector("#item-link").value.trim()) || null,
      image_url: imageUrl || null,
      is_visible: panel.querySelector("#item-visible").checked
    };
    if (!payload.title) { status("Please enter a title."); return; }
    status(editingId ? "Saving changes..." : "Adding item...");
    const result = editingId
      ? await db.from("portfolio_items").update({...payload,updated_at:new Date().toISOString()}).eq("id",editingId)
      : await db.from("portfolio_items").insert(payload);
    if (result.error) { status("Save failed: " + result.error.message); return; }
    resetForm();
    status("Saved successfully.");
    await loadRecords();
  });

  async function deleteRecord(row) {
    if (!isAdmin || !confirm("Delete '" + row.title + "'? This cannot be undone.")) return;
    const { error } = await db.from("portfolio_items").delete().eq("id",row.id);
    if (error) { status("Delete failed: " + error.message); return; }
    status("Item deleted.");
    await loadRecords();
  }

  db.auth.onAuthStateChange((_event, session) => {
    if (!session) {
      isAdmin = false;
      controls.hidden = true;
      loginForm.hidden = false;
      loadRecords();
    }
  });

  loadRecords();
  checkSession();
})();
</script>
