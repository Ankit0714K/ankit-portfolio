0px 8px 0;text-decoration:none;cursor:pointer}.btn.primary{background:var(--ink);color:var(--bg)}.btn.secondary{background:#7f7f7f4d;color:var(--ink)}.row{padding:18px 0 24px}.row h2{font-size:32px;padding:0 5vw 12px}.track{display:flex;gap:12px;overflow-x:auto;padding:4px 5vw 16px}.card{flex:0 0 min(270px,76vw);min-height:155px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:18px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;color:var(--ink)}button.card{cursor:pointer}.card:before{content:"";position:absolute;inset:0;background:var(--g);opacity:.22}.card>*{position:relative}.card h3{font-size:30px}.card span{font-size:13px;color:var(--ink);opacity:.8;margin-top:7px}.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 5vw}.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 14px;font-size:14px}footer{text-align:center;padding:12vh 20px 10vh;border-top:1px solid var(--line);margin-top:50px}footer h2{font-size:clamp(48px,10vw,110px)}footer p{color:var(--mute)}footer a{display:inline-block;margin:6px;padding:10px 20px;border-radius:6px;background:var(--red);color:#fff;text-decoration:none;font-weight:700}#modal{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:20}#modal.on{display:grid}.sheet{background:var(--panel);border-radius:12px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:28px;border:1px solid var(--line)}.sheet h2{font-size:48px;margin-bottom:8px}.meta{color:var(--red);font-weight:700;margin-bottom:14px}.sheet ul{padding-left:22px}.sheet .btn{margin-top:18px}@media(max-width:720px){nav{gap:10px;padding:12px 4vw}nav .logo{font-size:23px}nav a{font-size:13px}.hero{padding:5vh 5vw;min-height:76vh}.hero-layout{min-height:68vh;grid-template-columns:1fr;align-items:center}.hero-copy{padding:30px 0 150px}.hero-photo{right:-8vw;bottom:-4vh;width:82%;height:72%;max-height:none;object-position:center 18%;opacity:.76;mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 72%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 72%,transparent 100%)}.hero h1{font-size:clamp(46px,10vw,76px);max-width:8em}.hero p{font-size:16px;max-width:22em}.row h2{font-size:28px}}@media(max-width:360px){.hero h1{font-size:42px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<header class="hero"><div class="hero-layout"><div class="hero-copy"><div class="hero-heading"><h1>ANKIT<br>KANAUJIYA</h1></div><p>B.Tech CSE student exploring programming, web development, GitHub collaboration, and practical projects.</p><button class="btn primary" data-open="story">▶ Read my story</button><a class="btn secondary" href="#projects">Explore projects</a></div><img class="hero-photo" src="./ankit-photo.jpg" alt="Portrait of Ankit Kanaujiya"></div></header>

<script>
const ME={stories:[
{t:"The full story",s:"Who I am",g:"#e50914",meta:"My story",body:"<p>I'm Ankit Kanaujiya, a B.Tech Computer Science student who is learning by asking questions, experimenting, and building things. I like understanding how technology works instead of just copying steps, whether I'm studying Python, databases, software engineering models, or web development.</p><p>My learning has been practical as well as academic. I've been working on a School ERP idea, learning how to organize code on GitHub, and figuring out how to collaborate without losing work. I've also been preparing for community hackathon activities and exploring open-source development.</p><p>I don't claim to know everything yet. I'm building my skills one step at a time, learning from mistakes, and trying to turn what I learn into useful projects. This portfolio is a record of that process—and a place to keep improving.</p>"},
{t:"Experience",s:"",g:"#dd6b20",meta:"",body:""},
{t:"Internal Smart India Hackathon 2026",s:"Qualified · 24 August 2026",g:"#d69e2e",meta:"Certificate of Participation",body:"<p>Qualified in the Internal Smart India Hackathon 2026 at United University, organized in collaboration with WikiClub Tech-United University. A milestone in teamwork, creativity, and developing solutions to real-world challenges.</p>"},
{t:"My journey",s:"Learning, building, improving",g:"#3182ce",meta:"My journey",body:"<ul><li><b>Building fundamentals:</b> Studying core computer science topics including Python, databases, and software engineering.</li><li><b>Practising through projects:</b> Exploring web development and working on a School ERP concept.</li><li><b>Learning GitHub:</b> Getting comfortable with repositories, commits, file uploads, and protecting existing work while making changes.</li><li><b>Preparing to collaborate:</b> Exploring hackathons and open-source community work, including MLH and GDG Hackday activities.</li><li><b>Exploring ideas:</b> Brainstorming projects such as YUGA, an educational game concept inspired by Indian civilization and culture.</li><li><b>What's next:</b> Keep learning, improve the School ERP, finish more projects, and become more confident contributing to shared code.</li></ul>"}],
projects:[
{t:"School ERP",s:"School management platform",g:"#805ad5",meta:"In progress · Web development",body:"<p>A school-management project concept intended to bring everyday school tasks into one place.</p><ul><li>Management dashboard and teacher attendance</li><li>Teacher area for marking student attendance</li><li>Student area for fee details, attendance, and results</li><li>Planned role-based access and database-backed records</li></ul><p>I'm developing my understanding of the tools and workflow as the project grows.</p>"},
{t:"",s:"",g:"#319795",meta:"",body:""},{t:"",s:"",g:"#d53f8c",meta:"",body:""},{t:"",s:"",g:"#38a169",meta:"",body:""}],
skills:["HTML","CSS","Python","JavaScript · learning","GitHub · learning"]};
const $=s=>document.querySelector(s);let registry=[];
function card(c){if(!c.t)return '<div class="card" style="--g:'+c.g+'" aria-hidden="true"></div>';registry.push(c);return '<button class="card" style="--g:'+c.g+'" data-open="'+(registry.length-1)+'"><h3>'+c.t+'</h3>'+(c.s?'<span>'+c.s+'</span>':'')+'</button>'}
function render(){registry=[];$('#rows').innerHTML='<section class="row" id="stories"><h2>My story</h2><div class="track">'+ME.stories.map(card).join('')+'</div></section><section class="row" id="projects"><h2>Projects</h2><div class="track">'+ME.projects.map(card).join('')+'</div></section><section class="row" id="skills"><h2>Skills I\'m building</h2><div class="chips">'+ME.skills.map(s=>'<span class="chip">'+s+'</span>').join('')+'</div></section>'}
render();
document.addEventListener('click',e=>{const t=e.target.closest('[data-open]');if(!t)return;const c=t.dataset.open==='story'?ME.stories[0]:registry[Number(t.dataset.open)];if(!c)return;$('#sheet').innerHTML='<h2 id="modalTitle">'+c.t+'</h2>'+(c.meta?'<div class="meta">'+c.meta+'</div>':'')+(c.body||'')+'<button class="btn primary" id="close">Close</button>';$('#modal').classList.add('on');$('#close').focus()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.id==='close')$('#modal').classList.remove('on')});addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
</script>
